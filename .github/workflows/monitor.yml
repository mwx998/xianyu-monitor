name: Xianyu Luckin Card Monitor

on:
  schedule:
    - cron: "*/15 * * * *"   # 每15分钟(实际排队可能5~20分钟延迟)
  workflow_dispatch:          # 支持手动触发测试

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps
      - name: Scan
        env:
          SCT_SENDKEY: ${{ secrets.SCT_SENDKEY }}
          XY_COOKIE: ${{ secrets.XY_COOKIE }}
        run: python scan.py
      - name: Commit last report
        run: |
          git config user.name "monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add last_report.md 2>/dev/null || true
          git diff --cached --quiet || git commit -m "report $(date -u +%FT%TZ)"
          git push || true
